<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Pink Gradient -->
    <radialGradient id="pinkGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF4081" />
      <stop offset="55%" stop-color="#E91E63" />
      <stop offset="100%" stop-color="#880E4F" />
    </radialGradient>

    <!-- Cyan Wave Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="60%" stop-color="#00BCD4" />
      <stop offset="100%" stop-color="#006064" />
    </linearGradient>

    <!-- Golden Yellow Calligraphy Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4" />
      <stop offset="30%" stop-color="#FFEB3B" />
      <stop offset="70%" stop-color="#FDD835" />
      <stop offset="100%" stop-color="#F57F17" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Outer Ring with Mandala Accent Dots -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="#FDD835" stroke-width="3.5" stroke-dasharray="8, 14" opacity="0.75" />
  <circle cx="250" cy="250" r="226" fill="none" stroke="#E91E63" stroke-width="1.5" opacity="0.6" />

  <!-- Main Circular Emblem -->
  <circle cx="250" cy="250" r="220" fill="url(#pinkGrad)" filter="url(#subtleShadow)" />

  <!-- Subtle Mandala / Radial Rays Pattern -->
  <g opacity="0.12" stroke="#FFF" stroke-width="1.5">
    <circle cx="250" cy="250" r="190" fill="none" />
    <circle cx="250" cy="250" r="140" fill="none" />
    <line x1="250" y1="30" x2="250" y2="470" />
    <line x1="30" y1="250" x2="470" y2="250" />
    <line x1="94" y1="94" x2="406" y2="406" />
    <line x1="94" y1="406" x2="406" y2="94" />
    <!-- 12-point floral rays -->
    <path d="M 250 80 Q 265 140 250 170 Q 235 140 250 80 Z" fill="#FFF" />
    <path d="M 250 420 Q 265 360 250 330 Q 235 360 250 420 Z" fill="#FFF" />
    <path d="M 80 250 Q 140 265 170 250 Q 140 235 80 250 Z" fill="#FFF" />
    <path d="M 420 250 Q 360 265 330 250 Q 360 235 420 250 Z" fill="#FFF" />
  </g>

  <!-- Cyan Wave at Bottom -->
  <path d="M 40 300 Q 140 370 250 330 T 460 300 A 220 220 0 0 1 40 300 Z" fill="url(#cyanGrad)" opacity="0.95" />
  <path d="M 30 325 Q 150 410 260 370 T 470 330 A 220 220 0 0 1 30 325 Z" fill="#00E5FF" opacity="0.4" />

  <!-- Yellow Accent Arc / Line -->
  <path d="M 120 310 Q 250 340 380 310" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)" />
  <circle cx="250" cy="324" r="5" fill="#FFEB3B" />
  <circle cx="200" cy="321" r="3.5" fill="#FFEB3B" />
  <circle cx="300" cy="321" r="3.5" fill="#FFEB3B" />

  <!-- Bold Gujarati Calligraphy 'પ્રારંભ' (Prarambh) Text -->
  <!-- Top Anusvara / Bindi Dot -->
  <circle cx="295" cy="148" r="11" fill="url(#goldGrad)" filter="url(#glow)" />
  <circle cx="295" cy="148" r="7" fill="#FFFDE7" />

  <g filter="url(#subtleShadow)">
    <text x="250" y="248" 
          font-family="'Noto Sans Gujarati', 'Outfit', sans-serif" 
          font-size="88" 
          font-weight="900" 
          text-anchor="middle" 
          fill="url(#goldGrad)"
          letter-spacing="2px"
          filter="url(#glow)">
      પ્રારંભ
    </text>
  </g>

  <!-- Studio Subtitle Badge in Gujarati / English -->
  <g transform="translate(250, 282)">
    <rect x="-90" y="-12" width="180" height="24" rx="12" fill="rgba(10, 10, 15, 0.65)" stroke="#FDD835" stroke-width="1.2" />
    <text x="0" y="5" 
          font-family="'Outfit', sans-serif" 
          font-size="12" 
          font-weight="800" 
          text-anchor="middle" 
          fill="#FFF" 
          letter-spacing="3.5px">
      REEL STUDIO
    </text>
  </g>

  <!-- Surrounding 8 Accent Dots -->
  <circle cx="250" cy="45" r="4" fill="#FFEB3B" />
  <circle cx="395" cy="105" r="4" fill="#FFEB3B" />
  <circle cx="455" cy="250" r="4" fill="#FFEB3B" />
  <circle cx="395" cy="395" r="4" fill="#00E5FF" />
  <circle cx="250" cy="455" r="4" fill="#00E5FF" />
  <circle cx="105" cy="395" r="4" fill="#00E5FF" />
  <circle cx="45" cy="250" r="4" fill="#FFEB3B" />
  <circle cx="105" cy="105" r="4" fill="#FFEB3B" />
</svg>
